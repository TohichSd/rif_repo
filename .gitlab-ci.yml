workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

stages:
  - test
  - build
  - deploy

unit-tests:
  stage: test
  image: python:3.12-slim-bookworm
  variables:
    PYTHONPATH: src
    PYTHONDONTWRITEBYTECODE: '1'
  script:
    - python -m unittest discover -s tests -v

container-image:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p ~/.docker
    - |
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=. \
        --output "type=image,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,push=true"

kubernetes:
  stage: deploy
  image:
    name: alpine/helm:3
    entrypoint: [""]
  needs: [container-image]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KUBE_CONTEXT'
  resource_group: practice-kubernetes
  environment:
    name: practice-kubernetes
  variables:
    KUBE_NAMESPACE: rif-practice
  script:
    - |
      helm upgrade --install rif-practice ./helm/rif-practice \
        --kube-context "$KUBE_CONTEXT" --namespace "$KUBE_NAMESPACE" \
        --atomic --timeout 5m \
        --set-string image.repository="$CI_REGISTRY_IMAGE" \
        --set-string image.tag="$CI_COMMIT_SHA"
