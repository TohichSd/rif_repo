version: 2.1

jobs:
  build-and-deploy:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Test and build the Linux amd64 image
          command: |
            docker run --rm -e PYTHONPATH=/code/src -e PYTHONDONTWRITEBYTECODE=1 \
              -v "$PWD:/code:ro" -w /code python:3.12-slim-bookworm \
              python -m unittest discover -s tests -v
            docker buildx build --platform linux/amd64 --provenance=false --load \
              --tag "rif-practice-web:$CIRCLE_SHA1" .
            docker buildx build --platform linux/amd64 --provenance=false --load \
              --target heroku-release --tag "rif-practice-release:$CIRCLE_SHA1" .
      - run:
          name: Publish web and migration images and create a Heroku release
          command: |
            : "${HEROKU_API_KEY:?Set HEROKU_API_KEY in CircleCI}"
            : "${HEROKU_APP_NAME:?Set HEROKU_APP_NAME in CircleCI}"
            curl -fsSL https://cli-assets.heroku.com/install.sh | sh
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$HEROKU_API_KEY" | docker login registry.heroku.com --username=_ --password-stdin
            for process in web release; do
              image="registry.heroku.com/$HEROKU_APP_NAME/$process"
              docker tag "rif-practice-$process:$CIRCLE_SHA1" "$image"
              docker push "$image"
            done
            previous=$(heroku releases --num 1 --json --app "$HEROKU_APP_NAME" | jq -r '.[0].version // 0')
            heroku container:release web release --app "$HEROKU_APP_NAME"
            deadline=$((SECONDS + 300))
            until [ "$SECONDS" -ge "$deadline" ]; do
              release=$(heroku releases --num 1 --json --app "$HEROKU_APP_NAME")
              version=$(jq -r '.[0].version // 0' <<<"$release")
              status=$(jq -r '.[0].status' <<<"$release")
              if [ "$version" -gt "$previous" ]; then
                case "$status" in
                  succeeded) echo "Heroku release v$version succeeded"; exit 0 ;;
                  failed) echo "Heroku release v$version failed" >&2; exit 1 ;;
                esac
              fi
              sleep 5
            done
            echo "Timed out waiting for the Heroku release" >&2
            exit 1

workflows:
  heroku:
    jobs:
      - build-and-deploy:
          serial-group: << pipeline.project.slug >>/heroku
          filters:
            branches:
              only: main
